name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-flowbot:
    name: Typecheck — flowbot
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flowbot
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: flowbot/package-lock.json

      # npm ci uses the committed lockfile, so CI matches what was typechecked.
      # better-sqlite3 compiles a native module, hence a full install.
      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # The bot and the DEX must point at the same contracts on the same chain.
      # Drift between them doesn't error at runtime — the bot would just quote a
      # different deployment than the site shows — so it's caught here instead.
      - name: Config matches live Onyx deployment
        run: npm run check-config

  typecheck-web:
    name: Typecheck — web (Onyx + Mini App)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      # tsc alone rather than a full next build: fastest signal, and it catches
      # the class of error that would otherwise reach production.
      - name: Typecheck
        run: npx tsc --noEmit

      # Bot parser + intent-store unit tests (node:test via tsx). These are the
      # invariants trades depend on — no signature-free command yields a deep
      # link, intents can't be replayed/cross-used/expired-then-signed, and
      # /twap can't drift in direction from /buy and /sell.
      - name: Bot unit tests
        run: npm test

      # A direct rpc.testnet.arc.network reference in browser code 403s on the
      # Origin header and silently breaks writes. Make that a pipeline failure,
      # not something spotted by hand.
      - name: RPC build guard
        run: npm run check-rpc
