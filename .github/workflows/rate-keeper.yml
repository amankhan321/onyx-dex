name: FX rate keeper

# The StableSwap halts when the oracle goes stale — by design, so it can never
# price off a dead feed. Nothing was refreshing it, which is why trading stopped
# after 29 hours. This is that missing piece.
#
# The margin is thinner than the cron suggests. GitHub's scheduler is
# best-effort: it queues scheduled workflows under load and does not honour the
# requested cadence. Measured spacing between runs of THIS workflow has been
# 78-169 minutes, not 30 — every run succeeded, so this is scheduling, not code.
# It also disables scheduled workflows after 60 days without repo activity.
#
# So the real arithmetic, against a 6-hour (21,600s) staleness window: the
# heartbeat fires at 1h (rateKeeper.ts HEARTBEAT_AFTER) and the worst observed
# gap is 169 minutes, so 3,600 + 10,140 = 13,740s leaves 7,860s of margin. That
# absorbs one further short gap, not the dozen missed runs an on-time 30-minute
# cadence would give — two consecutive worst-case gaps would halt swaps.
#
# If the feed must not halt, move this off GitHub's scheduler to an external
# pinger, the same caveat telegram-cron.yml carries for the notification sweep.
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

concurrency:
  group: rate-keeper
  cancel-in-progress: false

jobs:
  push-rate:
    name: Refresh the FX rate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      - name: Push rate
        working-directory: web
        env:
          # Env only — never an argument, never echoed. GitHub masks it in logs,
          # and the script prints the rate, age, delta and tx hash, nothing else.
          RATE_UPDATER_KEY: ${{ secrets.RATE_UPDATER_KEY }}
          ARC_RPC_URL: https://rpc.testnet.arc.network
        run: |
          set -eu   # not -x: tracing would expose the key
          if [ -z "${RATE_UPDATER_KEY}" ]; then
            echo "RATE_UPDATER_KEY secret is not set on this repository" >&2
            exit 1
          fi
          npm run keeper
